<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identomat Slot Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  background:transparent;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'DM Mono','Courier New',monospace;
  overflow:hidden;
}

/* ── Scale wrapper for responsive fit ── */
#scaleRoot{
  display:flex;
  justify-content:center;
  align-items:center;
  transform-origin:top center;
  max-width:1000px;
  width:100%;
}

/* ── Machine outer shell ── */
.slot-machine{
  position:relative;
  background:#0c0723;
  border:none;
  border-radius:42px;
  padding:12px;
  box-shadow:0 0 30px rgba(90,30,200,0.12),0 0 60px rgba(90,30,200,0.06);
  cursor:pointer;
  user-select:none;
}

/* Win pulse ring */
.win-glow{
  position:absolute;inset:-4px;
  border-radius:46px;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.35s;
}
.win-glow.active{
  opacity:1;
  animation:winPulse 0.75s ease-in-out infinite alternate;
}
@keyframes winPulse{
  from{box-shadow:0 0 20px rgba(185,130,255,0.25),0 0 40px rgba(140,80,255,0.12);}
  to  {box-shadow:0 0 30px rgba(210,165,255,0.35),0 0 55px rgba(160,100,255,0.18);}
}

/* Win flash */
.win-flash{
  position:absolute;inset:0;
  border-radius:40px;
  background:rgba(220,200,255,0.15);
  pointer-events:none;
  opacity:0;
  z-index:20;
}
.win-flash.active{animation:flashOut 0.35s ease-out forwards;}
@keyframes flashOut{from{opacity:1;}to{opacity:0;}}

/* Sparkles */
.sparkle{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  z-index:30;
}
@keyframes sparkleFly{
  0%  {transform:translate(0,0) scale(1);opacity:1;}
  100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0;}
}

/* ── Inner frame ── */
.inner-frame{
  position:relative;
  display:flex;
  align-items:center;
  gap:24px;
  padding:32px;
  border-radius:32px;
  border:1px solid #20154a;
  background:linear-gradient(160deg,#1a0f52 0%,#100830 45%,#08051c 100%);
  box-shadow:inset 0 1px 0 rgba(200,160,255,0.08),inset 0 0 50px rgba(0,0,0,0.5);
}
/* Top neon line */
.inner-frame::before{
  content:'';
  position:absolute;
  top:0;left:40px;right:40px;height:2px;
  border-radius:0 0 2px 2px;
  background:linear-gradient(90deg,transparent 0%,rgba(150,90,255,0.55) 25%,rgba(200,150,255,0.9) 50%,rgba(150,90,255,0.55) 75%,transparent 100%);
  pointer-events:none;
}

/* ── Reel column ── */
.reel-col{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

/* ── Reel window ── */
.reel-window{
  position:relative;
  width:200px;height:260px;
  border-radius:14px;
  overflow:hidden;
  background:linear-gradient(160deg,#070218 0%,#04010f 100%);
  border:1.5px solid rgba(100,50,210,0.58);
  box-shadow:inset 0 0 30px rgba(0,0,0,0.85),inset 0 0 10px rgba(80,30,180,0.25),0 0 18px rgba(75,25,175,0.2);
  transition:border-color 0.4s,box-shadow 0.4s;
}
.reel-window.won{
  border-color:rgba(205,160,255,0.9);
  box-shadow:inset 0 0 28px rgba(0,0,0,0.7),inset 0 0 14px rgba(160,100,255,0.38),0 0 36px rgba(160,100,255,0.6);
}

/* Scrolling strip */
.reel-strip{
  position:absolute;
  top:0;left:0;right:0;
  will-change:transform;
}
.reel-item{
  width:100%;height:200px;
  display:flex;align-items:center;justify-content:center;
}
.sm-icon{
  display:flex;align-items:center;justify-content:center;
  width:78px;height:78px;flex-shrink:0;
}
.sm-icon.logo-icon{
  width:88px;height:88px;
  filter:drop-shadow(0 0 16px rgba(200,155,255,0.9));
}
.sm-icon svg{display:block;width:100%;height:100%;}

/* Gradient mask top & bottom */
.reel-mask{
  position:absolute;inset:0;
  pointer-events:none;z-index:2;
  background:linear-gradient(
    to bottom,
    rgba(4,1,16,0.92) 0%,
    rgba(4,1,16,0.08) 20%,
    transparent 33%,
    transparent 67%,
    rgba(4,1,16,0.08) 80%,
    rgba(4,1,16,0.92) 100%
  );
}

/* ── Label below each reel ── */
.reel-label{
  font-size:10px;font-weight:500;
  letter-spacing:0.12em;
  text-transform:uppercase;
  text-align:center;white-space:nowrap;
  min-width:170px;
  color:rgba(140,100,230,0.5);
  filter:none;
  transition:color 0.3s,filter 0.3s;
}
.reel-label.won{
  color:rgba(215,185,255,0.95);
  filter:drop-shadow(0 0 7px rgba(180,130,255,0.85));
}

/* ── Lever housing ── */
.lever-housing{
  position:relative;
  width:80px;height:112px;
  flex-shrink:0;
  background:#11033b;
  border:3px solid #1c0657;
  border-radius:16px;
  overflow:visible;
  cursor:pointer;
}
/* Extended hit areas */
.lever-hit-top{position:absolute;top:-100px;left:-8px;right:-8px;height:100px;cursor:pointer;}
.lever-hit-bot{position:absolute;bottom:-70px;left:-8px;right:-8px;height:70px;cursor:pointer;}

/* Inner track slot */
.lever-track{
  position:absolute;
  left:50%;transform:translateX(-50%);
  top:22px;width:36px;height:68px;
  background:#591EFF;border-radius:43px;
}

/* Shaft */
.lever-shaft{
  position:absolute;
  left:50%;transform:translateX(-50%);
  width:16px;background:#8053ff;border-radius:43px;
  top:-44px;height:100px;
  transition:top 0.32s cubic-bezier(0.4,0,0.2,1),height 0.32s cubic-bezier(0.4,0,0.2,1);
  z-index:3;
}
.lever-shaft.active{top:66px;height:44px;}

/* Ball */
.lever-ball{
  position:absolute;
  left:50%;transform:translateX(-50%);
  width:54px;height:54px;border-radius:50%;
  background:#d9d9d9;
  box-shadow:inset 0 -4px 4px rgba(0,0,0,0.25);
  top:-66px;
  transition:top 0.32s cubic-bezier(0.4,0,0.2,1);
  z-index:4;
}
.lever-ball.active{top:86px;}

/* ── Lever + label wrapper ── */
.lever-col{
  display:flex;flex-direction:column;
  align-items:center;gap:10px;
  align-self:center;
}
.lever-cta{
  font-size:15px;font-weight:500;
  letter-spacing:0.14em;text-transform:uppercase;
  color:rgba(255,255,255,0.85);
  text-align:center;line-height:1.3;
  user-select:none;pointer-events:none;
}
</style>
</head>
<body>

<div id="scaleRoot">
  <div class="slot-machine" id="slotMachine">
    <div class="win-glow" id="winGlow"></div>
    <div class="win-flash" id="winFlash"></div>
    <!-- sparkle container -->
    <div id="sparkleContainer" style="position:absolute;inset:0;pointer-events:none;z-index:30;overflow:hidden;border-radius:40px;"></div>

    <div class="inner-frame">

      <!-- Reel 0 -->
      <div class="reel-col">
        <div class="reel-window" id="reel0">
          <div class="reel-strip" id="strip0"></div>
          <div class="reel-mask"></div>
        </div>
        <div class="reel-label" id="label0">ID Verification</div>
      </div>

      <!-- Reel 1 -->
      <div class="reel-col">
        <div class="reel-window" id="reel1">
          <div class="reel-strip" id="strip1"></div>
          <div class="reel-mask"></div>
        </div>
        <div class="reel-label" id="label1">AML Monitoring</div>
      </div>

      <!-- Reel 2 -->
      <div class="reel-col">
        <div class="reel-window" id="reel2">
          <div class="reel-strip" id="strip2"></div>
          <div class="reel-mask"></div>
        </div>
        <div class="reel-label" id="label2">KYC Onboarding</div>
      </div>

      <!-- Lever -->
      <div class="lever-col">
        <div class="lever-housing" id="leverHousing">
          <div class="lever-hit-top"></div>
          <div class="lever-hit-bot"></div>
          <div class="lever-track"></div>
          <div class="lever-shaft" id="leverShaft"></div>
          <div class="lever-ball"  id="leverBall"></div>
        </div>
        <div class="lever-cta">CLICK<br>TO SPIN</div>
      </div>

    </div><!-- /inner-frame -->
  </div><!-- /slot-machine -->
</div><!-- /scaleRoot -->

// ─────────────────────────────────────────────
//  CONSTANTS (mirrors React source exactly)
// ─────────────────────────────────────────────
const FRAME_H    = 260;
const ITEM_H     = 200;
const OFFSET     = (FRAME_H - ITEM_H) / 2; // 30
const NUM_ICONS  = 13;
const NUM_REPS   = 5;
const LOGO_IDX   = 12;

const INITIAL_ICON_IDX = [0, 5, 3];
const INITIAL_Y        = INITIAL_ICON_IDX.map(idx => OFFSET - idx * ITEM_H);
const INITIAL_NAMES    = ['ID Verification', 'AML Monitoring', 'KYC Onboarding'];

// Logo at rep2/3/4 for staggered stop
const TARGET_Y   = [38, 51, 64].map(item => OFFSET - item * ITEM_H);
const DURATIONS  = [2800, 3500, 4200];

function easeOutQuint(t){ return 1 - Math.pow(1 - t, 5); }

// ─────────────────────────────────────────────
//  BUILD STRIP DOM
// ─────────────────────────────────────────────
function buildStrips(){
  for(let r=0;r<3;r++){
    const strip = document.getElementById('strip'+r);
    strip.innerHTML = '';
    for(let rep=0;rep<NUM_REPS;rep++){
      for(let idx=0;idx<NUM_ICONS;idx++){
        const item = document.createElement('div');
        item.className = 'reel-item';
        const icon = document.createElement('div');
        icon.className = idx===LOGO_IDX ? 'sm-icon logo-icon' : 'sm-icon';
        icon.innerHTML = ICONS[idx].svg;
        item.appendChild(icon);
        strip.appendChild(item);
      }
    }
    strip.style.transform = `translateY(${INITIAL_Y[r]}px)`;
  }
}

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let isSpinning  = false;
let currentY    = [...INITIAL_Y];
let autoTimer   = null;
let rafIds      = [null,null,null];
let labelIntervals = [];
let sparkleId   = 0;

// ─────────────────────────────────────────────
//  RESET
// ─────────────────────────────────────────────
function resetStrips(){
  for(let i=0;i<3;i++){
    const strip = document.getElementById('strip'+i);
    strip.style.transition = 'none';
    strip.style.transform  = `translateY(${INITIAL_Y[i]}px)`;
    strip.style.filter     = 'none';
  }
  currentY = [...INITIAL_Y];
}

// ─────────────────────────────────────────────
//  SPARKLES
// ─────────────────────────────────────────────
function createSparkles(){
  const container = document.getElementById('sparkleContainer');
  container.innerHTML = '';
  const colors = ['#c890ff','#a060f8','#ffffff','#e0b8ff','#8040e8'];
  for(let n=0;n<22;n++){
    const ang = Math.random()*Math.PI*2;
    const dst = 30 + Math.random()*80;
    const dx  = Math.cos(ang)*dst;
    const dy  = Math.sin(ang)*dst;
    const size= 4 + Math.random()*5;
    const color = colors[Math.floor(Math.random()*colors.length)];
    const delay = Math.random()*0.25;
    const dur   = 0.7 + Math.random()*0.35;
    const el    = document.createElement('div');
    el.className = 'sparkle';
    el.style.cssText = `
      width:${size}px;height:${size}px;
      left:${10+Math.random()*80}%;
      top:${10+Math.random()*80}%;
      background:${color};
      --dx:${dx}px;--dy:${dy}px;
      animation:sparkleFly ${dur}s ease-out ${delay}s forwards;
    `;
    container.appendChild(el);
    sparkleId++;
  }
  setTimeout(()=>{ container.innerHTML=''; }, 1100);
}

// ─────────────────────────────────────────────
//  LABELS
// ─────────────────────────────────────────────
function setLabel(i, text, won){
  const el = document.getElementById('label'+i);
  el.textContent = text;
  el.className   = 'reel-label' + (won ? ' won' : '');
}
function setReelWon(i, won){
  document.getElementById('reel'+i).className = 'reel-window' + (won ? ' won' : '');
  setLabel(i, won ? 'Identomat' : INITIAL_NAMES[i], won);
}

// ─────────────────────────────────────────────
//  SPIN
// ─────────────────────────────────────────────
function spin(){
  if(isSpinning) return;
  isSpinning = true;

  if(autoTimer) clearTimeout(autoTimer);
  rafIds.forEach(id=>{ if(id) cancelAnimationFrame(id); });
  rafIds = [null,null,null];
  labelIntervals.forEach(clearInterval);
  labelIntervals = [];

  // Lever press
  document.getElementById('leverShaft').classList.add('active');
  document.getElementById('leverBall').classList.add('active');
  setTimeout(()=>{
    document.getElementById('leverShaft').classList.remove('active');
    document.getElementById('leverBall').classList.remove('active');
  }, 420);

  // Reset won states
  for(let i=0;i<3;i++) setReelWon(i, false);
  document.getElementById('winGlow').classList.remove('active');
  document.getElementById('winFlash').classList.remove('active');

  // Cycle labels while spinning
  const ticks = [1,7,3];
  labelIntervals = [0,1,2].map(i =>
    setInterval(()=>{
      ticks[i] = (ticks[i]+1) % (NUM_ICONS-1);
      setLabel(i, ICONS[ticks[i]].name, false);
    }, 90)
  );

  let doneCount = 0;

  [0,1,2].forEach(i => {
    const strip     = document.getElementById('strip'+i);
    const fromY     = currentY[i];
    const toY       = TARGET_Y[i];
    const duration  = DURATIONS[i];
    const startTime = performance.now();

    function frame(now){
      const t = Math.min((now - startTime)/duration, 1);
      const y = fromY + (toY - fromY) * easeOutQuint(t);
      strip.style.transform = `translateY(${y}px)`;

      const speed  = 5*Math.pow(1-t, 4);
      const blurPx = Math.min(speed*2.8, 13);
      strip.style.filter = blurPx > 0.5 ? `blur(${blurPx.toFixed(1)}px)` : 'none';

      if(t < 1){
        rafIds[i] = requestAnimationFrame(frame);
      } else {
        strip.style.transform = `translateY(${toY}px)`;
        strip.style.filter    = 'none';
        currentY[i]           = toY;

        clearInterval(labelIntervals[i]);
        setReelWon(i, true);

        doneCount++;
        if(doneCount === 3){
          // Win effects
          document.getElementById('winGlow').classList.add('active');
          const flash = document.getElementById('winFlash');
          flash.classList.remove('active');
          void flash.offsetWidth; // force reflow
          flash.classList.add('active');

          createSparkles();

          // Notify parent Webflow page
          window.parent.postMessage({type:'SLOT_WIN'}, '*');

          autoTimer = setTimeout(()=>{
            document.getElementById('winGlow').classList.remove('active');
            for(let j=0;j<3;j++) setReelWon(j, false);
            resetStrips();
            requestAnimationFrame(()=>requestAnimationFrame(()=>{
              isSpinning = false;
            }));
          }, 2800);
        }
      }
    }
    rafIds[i] = requestAnimationFrame(frame);
  });
}

// ─────────────────────────────────────────────
//  RESPONSIVE SCALING
// ─────────────────────────────────────────────
function scaleToFit(){
  const root    = document.getElementById('scaleRoot');
  const machine = document.querySelector('.slot-machine');
  if(!machine) return;

  // Get natural size
  const naturalW = machine.scrollWidth;
  const naturalH = machine.scrollHeight;
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  const scaleX = vw  / naturalW;
  const scaleY = vh  / naturalH;
  const scale  = Math.min(scaleX, scaleY, 1); // never upscale beyond 1

  root.style.transform = `scale(${scale})`;
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
buildStrips();
scaleToFit();
window.addEventListener('resize', scaleToFit);

document.getElementById('leverHousing').addEventListener('click', e=>{
  e.stopPropagation();
  spin();
});
